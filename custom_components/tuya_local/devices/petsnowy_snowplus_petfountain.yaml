name: Pet fountain
products:
  - id: 6atwtbtrc6xszdem
    manufacturer: PetSnowy
    model: Snow+ fountain
entities:
  - entity: switch
    icon: "mdi:water-pump"
    dps:
      - id: 1
        type: boolean
        name: switch
  - entity: select
    translation_key: activation_mode
    category: config
    dps:
      - id: 2
        type: string
        name: option
        mapping:
          - dps_val: normal
            value: normal
          - dps_val: smart
            value: smart
          - dps_val: night
            value: night
  - entity: sensor
    translation_key: filter_life
    class: duration
    category: diagnostic
    dps:
      - id: 3
        type: integer
        name: sensor
        unit: d
        range:
          min: 0
          max: 30
  - entity: sensor
    name: Clean left
    icon: "mdi:pump"
    class: duration
    category: diagnostic
    dps:
      - id: 4
        type: integer
        name: sensor
        unit: d
        range:
          min: 0
          max: 7
  - entity: button
    translation_key: filter_reset
    category: config
    dps:
      - id: 5
        type: boolean
        name: button
  - entity: button
    name: Clean reset
    icon: "mdi:pump"
    category: config
    dps:
      - id: 6
        type: boolean
        name: button
  - entity: number
    name: Filter life
    icon: "mdi:air-filter"
    category: config
    dps:
      - id: 7
        type: integer
        name: value
        optional: true
        unit: d
        range:
          min: 0
          max: 90
  - entity: number
    name: Clean interval
    icon: "mdi:pump"
    category: config
    dps:
      - id: 8
        type: integer
        name: value
        optional: true
        unit: d
        range:
          min: 0
          max: 31
  - entity: binary_sensor
    translation_key: tank_empty
    dps:
      - id: 101
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 1
            value: true
          - value: false
  - entity: binary_sensor
    name: Replace filter
    class: problem
    dps:
      - id: 101
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 2
            value: true
          - value: false
  - entity: binary_sensor
    name: Change water
    class: problem
    icon: "mdi:water-sync"
    dps:
      - id: 101
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 4
            value: true
          - value: false
  - entity: light
    translation_key: indicator
    category: config
    dps:
      - id: 102
        type: boolean
        name: switch
  - entity: number
    name: Smart mode run time
    icon: "mdi:timer-play-outline"
    category: config
    dps:
      - id: 104
        type: integer
        name: value
        unit: min
        range:
          min: 1
          max: 60
  - entity: number
    name: Smart mode pause time
    icon: "mdi:timer-pause-outline"
    category: config
    dps:
      - id: 105
        type: integer
        name: value
        unit: min
        range:
          min: 1
          max: 60
